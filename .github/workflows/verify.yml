name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Typecheck, unit, and production audit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  browser-gate:
    name: Playwright compatibility on GitHub macOS Intel (informational)
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npx --no-install playwright install chromium
      # Product e2e is Apple Silicon `release:gate`. Public macOS runners are
      # Intel, so this job stays as a signal only: setup failures still fail
      # the job; Playwright flakes do not fail Verify or block merge.
      - name: Run Playwright
        id: e2e
        continue-on-error: true
        run: npm run test:e2e
      - name: Record informational Playwright failure
        if: steps.e2e.outcome == 'failure'
        run: echo "::warning::Intel Playwright failed. Product e2e is Apple Silicon release:gate; this job does not block merge."
