name: Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json (with or without a leading v)
        required: true
        default: 0.1.0-alpha.13
        type: string

permissions:
  contents: write

concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  gate-and-draft:
    name: Clean-download gate and Draft Release
    # Exact release target. Public standard macOS runners are Intel; this job
    # intentionally requires the configured GitHub arm64 larger runner.
    runs-on: macos-15-xlarge
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@11.6.2
      - name: Require the Apple Silicon release target
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Build and test the clean-download Kits
        run: npm run release:gate -- --version "$RELEASE_VERSION"
      - name: Write checksummed Draft Release notes
        run: node scripts/release/notes.mjs --version="$RELEASE_VERSION" --out-dir=dist/release --output=dist/release/draft-release-notes.md
      - name: Create the prerelease draft with the Agent, Claude, and Contributor Kit archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_VERSION="${RELEASE_VERSION#v}"
          gh release create "v${ASSET_VERSION}" \
            "dist/release/ikran-agent-plugin-kit-${ASSET_VERSION}.tar.gz" \
            "dist/release/ikran-claude-plugin-kit-${ASSET_VERSION}.tar.gz" \
            "dist/release/ikran-contributor-verification-kit-${ASSET_VERSION}.tar.gz" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Ikran v${ASSET_VERSION} (alpha)" \
            --notes-file dist/release/draft-release-notes.md
